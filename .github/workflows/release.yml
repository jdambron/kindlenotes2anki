name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: kindlenotes2anki
            asset: kindlenotes2anki-x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: kindlenotes2anki
            asset: kindlenotes2anki-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin: kindlenotes2anki
            asset: kindlenotes2anki-aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            bin: kindlenotes2anki
            asset: kindlenotes2anki-armv7-unknown-linux-gnueabihf
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: kindlenotes2anki
            asset: kindlenotes2anki-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: kindlenotes2anki.exe
            asset: kindlenotes2anki-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v7

      # GitHub macOS runners ship aws/tap without trust; brew warns on every use
      - name: Remove untrusted Homebrew taps
        if: runner.os == 'macOS'
        run: brew untap aws/tap 2>/dev/null || true

      - name: Install Linux cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get -y install musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get -y install gcc-aarch64-linux-gnu
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get -y install gcc-arm-linux-gnueabihf
              ;;
          esac

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          # Keep target.*.linker from .cargo/config.toml effective
          rustflags: ""

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Binaries are already stripped via profile.release in Cargo.toml
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          dst="dist/${{ matrix.asset }}"
          cp "$src" "$dst"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release-upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -lR artifacts

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
