[package]
name = "kindlenotes2anki"
version = "0.17.2"
authors = ["jdambron"]
description = "A tool to import kindle clippings file to Anki"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
