[package]
name = "kindlenotes2anki"
version = "0.14.7"
authors = ["jdambron"]
description = "A tool to import kindle clippings file to Anki"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", features = ["toml"] }
csv = "1.4.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
