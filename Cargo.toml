[package]
name = "kindlenotes2anki"
version = "0.15.0"
authors = ["jdambron"]
description = "A tool to import kindle clippings file to Anki"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.12"
ureq = { version = "3.2.0", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
